#:schema https://docs.typora.io/schema/theme-1.json
# Generated by scripts/build-theme.sh from theme/src/base.toml + scripts/gen-palettes.py. Edit the sources.
name = "Ignorance"
color-scheme = "auto"
author = "ignorance-shiyao"
version = "0.1.0"
description = "纸面正文、中文排版与八套浅深配色。"
css = "theme.css"

[vars]
body-font = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif'
heading-font = 'Georgia, "Noto Serif SC", "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", STSong, SimSun, serif'
mono-font = '"SFMono-Regular", "JetBrains Mono", Menlo, Monaco, Consolas, "PingFang SC", monospace'
font-size = "15px"
line-height = 1.8
letter-spacing = "0.01em"
content-width = "820px"
paragraph-spacing = "0.9em"
h2-num = '""'
h3-num = '""'
cross-tint = "transparent"
eink = "0"
eink-mark = "none"

[vars.light]
bg = "#FAF8F4"
text = "#1F2937"
heading = "#123258"
muted = "#6B7280"
accent = "#356FD8"
link = "#2563EB"
syntax-marker = "#A3AEBD"
surface = "#F3F0EA"
surface-hover = "#EDF3FF"
code-bg = "#F4F2ED"
diagram-fill = "#EDEBE6"
diagram-border = "#B8BCC4"
inline-code-bg = "#EEF1F6"
border = "#E5EAF0"
highlight = "#FBEFB4"
selection = "#D9E4FB"
block-selection = "#E1EAFC"
caret = "#356FD8"
del = "#8A93A0"
placeholder = "#A3AEBD"
alert-note = "#2867C9"
alert-tip = "#247A49"
alert-important = "#9333B8"
alert-warning = "#8A5A00"
alert-caution = "#B63D49"

[vars.dark]
bg = "#0F172A"
text = "#E5E9F0"
heading = "#F9FAFB"
muted = "#9CA3AF"
accent = "#6F9AF4"
link = "#7DB3FF"
syntax-marker = "#5B6678"
surface = "#162033"
surface-hover = "#1B2B43"
code-bg = "#0C1322"
diagram-fill = "#232B3B"
diagram-border = "#5F6877"
inline-code-bg = "#1B2638"
border = "#334155"
highlight = "#4A4120"
selection = "#22385C"
block-selection = "#1B2B48"
caret = "#6F9AF4"
del = "#7C8799"
placeholder = "#5B6678"
alert-note = "#60A5FA"
alert-tip = "#34D399"
alert-important = "#D08BF0"
alert-warning = "#FBBF24"
alert-caution = "#F87171"

[elements.headings]
weight = 500
line-height = 1.4
letter-spacing = "0"

[elements.h1]
size = "30px"
margin = ["1.2em", "0.8em"]
weight = 500

[elements.h2]
size = "22px"
margin = ["1.6em", "0.7em"]
rule = "none"

[elements.h3]
size = "18px"
margin = ["1.4em", "0.6em"]

# h4 to h6 are small sans headings.
[elements.h4]
size = "16px"
weight = 700
color = "$accent"

[elements.h5]
size = "14px"
weight = 700

[elements.h6]
size = "12px"
weight = 700
color = "$muted"

[elements.link]
underline = "hover"

[elements.strong]
weight = 600

[elements.blockquote]
style = "card"
italic = false
indent = "0px"

[elements.code-block]
style = "card"
radius = "8px"
font-size = "0.9em"

[elements.inline-code]
radius = "4px"
color = "$accent"
border = "transparent"

[elements.table]
style = "card"
stripe = "$surface"

[elements.hr]
thickness = "1px"

[elements.list]
bullet = "disc"
marker-color = "$accent"

[chrome]
surface-radius = "14px"
surface-shadow = "none"
surface-inset = "8px"
surface-gap = "8px"
tree-selected-shadow = "none"
tree-selected-radius = "8px"
divider-width = "1px"

[chrome.light]
sidebar-bg = "#F3F0EA"
page-bg = "#FAF8F4"
accent = "#356FD8"
tree-selected-bg = "#E1EAFC"
hover-bg = "#EDF3FF"
panel-bg = "#F3F0EA"

[chrome.dark]
