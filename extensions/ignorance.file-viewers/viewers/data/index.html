<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../shared.css" />
    <link rel="stylesheet" href="viewer.css" />
    <script src="../../__typora/view.js"></script>
    <script src="js-yaml.js"></script>
    <script type="module" src="viewer.js"></script>
  </head>
  <body>
    <header>
      <span class="ficon" id="icon" data-kind="data" aria-hidden="true"></span>
      <div class="title"><span id="name"></span><span id="info"></span></div>
      <span class="spacer"></span>
      <button id="expand" type="button" aria-label="全部展开" title="全部展开"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg></button>
      <button id="collapse" type="button" aria-label="全部折叠" title="全部折叠"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 20 5-5 5 5"/><path d="m7 4 5 5 5-5"/></svg></button>
      <div class="seg" role="group">
        <button id="m-tree" type="button" aria-pressed="true" aria-label="树" title="树"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12h-8"/><path d="M21 6H8"/><path d="M21 18h-8"/><path d="M3 6v4c0 1.1.9 2 2 2h3"/><path d="M3 10v6c0 1.1.9 2 2 2h3"/></svg></button>
        <button id="m-src" type="button" aria-pressed="false" aria-label="源码" title="源码"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg></button>
      </div>
    </header>
    <main><div id="tree"></div><pre id="src" hidden></pre><div id="err" hidden></div></main>
  </body>
</html>
